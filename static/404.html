<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Level the Field</title>
<script>
  // Any address that does not exist lands here. Send it to the site's own not-found page.
  var base = null;
  if (!base){ var parts = location.pathname.split('/'); base = /\.github\.io$/.test(location.hostname) && parts.length > 2 ? '/' + parts[1] + '/' : '/'; }
  if (location.pathname !== base) location.replace(base + '#/not-found');
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:40px;background:#fff;color:#15171A">
<h1>That page isn't here</h1>
<p><a id="home" href="/" style="color:inherit">Go to the front page</a></p>
<script>document.getElementById('home').setAttribute('href', base);</script>
</body>
</html>
